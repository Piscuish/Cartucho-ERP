[package]
name = "cartucho-erp-desktop"
version = "0.4.1"
description = "Cartucho ERP — Aplicación de escritorio local-first (Tauri 2 + Rust + SQLite)"
authors = ["Cartucho ERP"]
edition = "2021"

[lib]
name = "cartucho_erp_desktop_lib"
# Solo escritorio: "staticlib"/"cdylib" son para móvil y ocupaban ~1 GB extra por compilación.
crate-type = ["rlib"]

[features]
default = []
desktop-tauri = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog", "dep:tauri-plugin-updater", "dep:tauri-plugin-process"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
ed25519-dalek = "2"
sha2 = "0.10"
machine-uid = "0.5"
ureq = { version = "2", features = ["json"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
base64 = "0.22"
argon2 = { version = "0.5", features = ["std"] }
password-hash = { version = "0.5", features = ["rand_core"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
directories = "5.0"
# Acceso desde celulares por la red local (ADR 0009)
tiny_http = "0.12"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
local-ip-address = "0.6"
tauri = { version = "2", features = [], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }

[dev-dependencies]
tempfile = "3"

# Compilación de desarrollo más liviana en disco: sin información de depuración completa
# (la carpeta target pasa de varios GB a una fracción) y las dependencias sin símbolos.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Instalador final más pequeño.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

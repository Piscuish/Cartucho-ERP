[package]
name = "cartucho-erp-desktop"
version = "0.1.0"
description = "Cartucho ERP — Aplicación de escritorio local-first (Tauri 2 + Rust + SQLite)"
authors = ["Cartucho ERP"]
edition = "2021"

[lib]
name = "cartucho_erp_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
desktop-tauri = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
base64 = "0.22"
argon2 = { version = "0.5", features = ["std"] }
password-hash = { version = "0.5", features = ["rand_core"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
directories = "5.0"
tauri = { version = "2", features = [], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }

[dev-dependencies]
tempfile = "3"
